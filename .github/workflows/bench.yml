name: bench-jev
on:
  workflow_dispatch:
    inputs:
      engines:
        description: "moteurs à comparer (jev | jev,claude)"
        default: "jev"
      regen:
        description: "régénérer les variantes orientées (appels Claude)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install -g @anthropic-ai/claude-code
      - uses: actions/cache@v4
        with:
          path: |
            an_data
            data
          key: an-${{ github.run_id }}
          restore-keys: an-
      - run: python -m pipeline.ingest
      - name: Diagnostic des moteurs
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf %s "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          claude --version
          echo "OPENROUTER_API_KEY définie : $([ -n "$OPENROUTER_API_KEY" ] && echo oui || echo NON)"
          echo "CLAUDE_CODE_OAUTH_TOKEN défini : $([ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && echo oui || echo NON)"
          echo "Réponds uniquement OK" | claude -p --model claude-haiku-5-5 --tools "" --no-session-persistence 2>&1 | head -c 600; echo "exit=${PIPESTATUS[1]}"
      - name: Banc d'essai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python -m pipeline.bench_jev --engines "${{ inputs.engines }}" ${{ inputs.regen && '--gen' || '' }}
          cat BENCH_JEV.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-jev
          path: |
            BENCH_JEV.md
            data/bench_jev.json
            data/bench_neutrality.json
