/* ---------- hémicycle ---------- */
const lay = {};
function layout(N) {
  if (lay[N]) return lay[N];
  const R = 11, r0 = 0.36, dr = (1 - r0) / (R - 1);
  const radii = [...Array(R)].map((_, i) => r0 + i * dr), sum = radii.reduce((a, b) => a + b, 0);
  const cnt = radii.map(r => Math.round(N * r / sum));
  let diff = N - cnt.reduce((a, b) => a + b, 0), k = R - 1;
  while (diff !== 0) { cnt[k] += diff > 0 ? 1 : -1; diff += diff > 0 ? -1 : 1; k = (k + R - 1) % R; }
  const seats = [];
  radii.forEach((r, i) => { for (let j = 0; j < cnt[i]; j++) { const th = Math.PI * (1 - j / (cnt[i] - 1)); seats.push({ x: r * Math.cos(th), y: -r * Math.sin(th), th, r }); } });
  seats.sort((a, b) => (b.th - a.th) || (a.r - b.r));
  const rad = 0.4 * Math.min(dr, Math.PI / (cnt[R - 1] - 1));
  return lay[N] = { seats, rad };
}
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, seed) { const r = rng(seed); for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

  const vb = opt.named ? '-1.24 -1.22 2.48 1.4' : '-1.04 -1.04 2.08 1.2';
  return `<svg viewBox="${vb}" role="img" aria-label="${label}">${c}${opt.labels || ''}${opt.center || ''}</svg>`;
}

function seatArr(q) { const s = q.seats, a = []; for (let i = 0; i < s.length; i += 2) a.push({ g: ORDER[s.charCodeAt(i) - 65], st: s[i + 1] }); return a; }

/* ---------- pronostic et surprise ---------- */
const PCLS = { large: 'Large majorité pour', serre: 'Majorité pour, sans plus', contre: 'Majorité contre' };
const PSUB = { large: '70 % ou plus des votes exprimés', serre: 'entre 50 et 70 % des votes exprimés', contre: 'moins de 50 % de pour' };
function predClass(q) { const t = totals(q), s = t.p / (t.p + t.c); return s >= .7 ? 'large' : s >= .5 ? 'serre' : 'contre'; }
function predScore() { const ks = Object.keys(state.preds).filter(n => state.preds[n] !== 'none' && state.answers[n]); return { ok: ks.filter(n => state.preds[n] === predClass(byN[n])).length, n: ks.length }; }
function viewPredict(q) {
  return `${progress()}<div class="card reveal"><span class="tag">🎯 Ton pronostic</span>
  <p class="verdict">Ton vote : <b>${esc(low(say(q.n, state.answers[q.n])))}</b>.</p>
  <h3>Et les députés présents, qu’ont-ils fait ?</h3>
  <p class="small muted">« Pour » veut dire ici : ${esc(low(say(q.n, 'pour')))}. On compte seulement les pour et les contre.</p>
  <div class="opts">${Object.keys(PCLS).map(k => `<button class="btn opt" data-act="pred" data-v="${k}"><b>${PCLS[k]}</b><span class="small muted">${PSUB[k]}</span></button>`).join('')}</div>
  <button class="btn ghost" data-act="pred" data-v="none">Je préfère ne pas parier</button></div>`;
}
function predFb(q) {
  const pr = state.preds[q.n]; if (!pr || pr === 'none') return '';
  const real = predClass(q), t = totals(q), sh = Math.round(t.p / (t.p + t.c) * 100);
  return `<p class="verdict ${pr === real ? 'same' : 'diff'}">${pr === real ? '🎯 Bien vu' : '😮 Surprise'} : tu pensais « ${esc(low(PCLS[pr]))} », le résultat est « ${esc(low(PCLS[real]))} » (${sh} % de pour).</p>`;
}
const agreeVal = (a, b) => STATS.agree[a + '|' + b] ?? STATS.agree[b + '|' + a];
function surprise(q) {
  const lab = {}; SIGS.filter(g => g !== 'NI' && q.g[g]).forEach(g => { const l = stLabel(stance(q.g[g])); if (l === 'pour' || l === 'contre') lab[g] = l; });
  const gs = Object.keys(lab); let same = 0, split = 0;
  for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++) { const v = agreeVal(gs[i], gs[j]); if (v == null) continue; if (lab[gs[i]] === lab[gs[j]]) { if (v < .4) same++; } else if (v > .85) split++; }
  const out = [];
  if (same) out.push(`${same} paire${same > 1 ? 's' : ''} de groupes qui votent d’habitude très différemment (moins de 4 votes sur 10 en commun) ont pris ici la même position.`);
  if (split) out.push(`${split} paire${split > 1 ? 's' : ''} de groupes qui votent presque toujours pareil (plus de 85 % du temps) se sont séparées.`);
  if (!out.length) out.push('Rien d’inhabituel dans les alliances sur ce vote : les groupes se sont placés comme d’habitude.');
  return out;
}
function surpBlock(q) {

  <details><summary>Un « contre » veut-il dire « opposé à l’idée » ?</summary><div class="body"><p class="small">Pas forcément, et un « pour » peut aussi cacher des réserves. Quelques raisons fréquentes :</p><ul class="m small"><li>Le texte est jugé insuffisant, ou trop large : on partage l’objectif, pas la méthode.</li><li>Une seule mesure d’un texte long déplaît, alors que le reste convient.</li><li>Le moment, le financement ou la procédure ne conviennent pas.</li><li>Une consigne de groupe ou une tactique parlementaire.</li></ul></div></details></div>`;
}

function promTally() {
  const t = {};
  state.order.filter(qn => PROM[qn]).forEach(qn => { const q = byN[qn]; PROM[qn].forEach(p => { if (!p.exp) return; const gs = p.groups.length ? p.groups : SIGS.filter(g => q.g[g]), ks = gs.map(g => status(g, q, p.exp).k), k = ks.every(x => x === 'ok') ? 'ok' : ks.every(x => x === 'ko') ? 'ko' : 'mid'; (t[p.bloc] = t[p.bloc] || { ok: 0, ko: 0, mid: 0 })[k]++; }); });

}
function vbar(o) { const n = o.ok + o.mid + o.ko || 1; return `<div class="bar" title="${o.ok} cohérent, ${o.mid} partiel, ${o.ko} contradictoire"><i class="p" style="width:${o.ok / n * 100}%"></i><i class="a" style="width:${o.mid / n * 100}%"></i><i class="c" style="width:${o.ko / n * 100}%"></i></div>`; }

/* ---------- récap en story et carte à partager ---------- */
function storyColor(r, s) { const sc = r.map(x => x.score), mn = Math.min(...sc), mx = Math.max(...sc), x = r.find(y => y.s === s); if (!x) return 'rgba(255,255,255,.12)'; const p = mx === mn ? 50 : (x.score - mn) / (mx - mn) * 100; return `color-mix(in srgb, #ffd45e ${Math.round(p)}%, rgba(255,255,255,.2))`; }
function storyList() {

function viewStory() {
  const sl = storyList(), i = Math.min(state.slide, sl.length - 1), last = i === sl.length - 1;
  return `<div class="story" role="dialog" aria-label="Ton récap"><div class="bars">${sl.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
  <div class="strow"><span class="small">${i + 1} / ${sl.length}</span><button class="link" data-act="storyend">Passer</button></div>
  <div class="slide" id="slide">${sl[i]()}</div>
  <div class="stnav"><button class="btn" data-act="sprev" ${i === 0 ? 'disabled' : ''} aria-label="Précédent">←</button>${last ? '<button class="btn white" data-act="storyend">Voir le détail</button>' : '<button class="btn white" data-act="snext">Suivant</button>'}</div></div>`;

const slideCount = () => storyList().length;
function slideGo(d) { const n = slideCount(), k = Math.max(0, Math.min(n - 1, state.slide + d)); if (k === state.slide) return; state.slide = k; render(); }

function ensureCard() { if (state.cardUrl) return; makeCard().then(u => { state.cardUrl = u; const im = document.getElementById('cardimg'); if (im) im.src = u; }).catch(() => {}); }

/* ---------- comment c'est fait ---------- */
function viewHow() {
  return `${topbar()}<button class="link" data-act="back" style="align-self:flex-start">← Retour</button>
  <div class="card hero reveal"><h1 style="font-size:clamp(1.9rem,7vw,2.6rem)">Comment c’est <span class="hl">fait</span></h1><p>Ce site compare tes réponses à de vrais votes. Voici d’où viennent les données, comment on choisit, et ce qu’il ne faut pas en conclure.</p></div>
  <div class="card reveal"><span class="tag warn">⚠️ Statut : prototype, textes non relus</span><p class="small">Les résumés et les explications de mots sont écrits par une IA à partir de sources publiques. Ils n’ont pas encore été relus par deux personnes de sensibilités politiques opposées, étape prévue avant toute publication large. Chaque vote renvoie vers le scrutin officiel pour que tu puisses vérifier.</p></div>
  <div class="card reveal"><h3>D’où viennent les votes</h3><p class="small">Des données ouvertes de l’Assemblée nationale : les scrutins publics de la 17e législature, avec le vote de chaque député et sa place dans l’hémicycle. Rien n’est inventé ni estimé : les points absents sont des députés qui n’ont pas voté.</p></div>
  <div class="card reveal"><h3>Comment les questions sont choisies</h3><p class="small">Dans ce prototype, ${D.q.length} votes ont été choisis à la main pour couvrir ${D.cats.length} thèmes, puis tirés au hasard. À terme, la sélection serait automatisée avec des critères publics : désaccord réel entre groupes, participation suffisante, mesure précise plutôt que texte fourre-tout.</p></div>
  <div class="card reveal"><h3>Règles de neutralité</h3><ul class="m small"><li>Aucun nom de parti ni de personne pendant le quiz : tu juges la mesure, pas l’étiquette.</li><li>Chaque fiche présente des arguments des deux côtés, avec le même poids.</li><li>Les boutons disent précisément pour quoi ou contre quoi tu votes, car un « contre » peut vouloir dire supprimer, rejeter ou refuser une mesure.</li><li>Après chaque vote, une explication montre pourquoi le résultat peut surprendre.</li></ul></div>
  <div class="card reveal"><h3>Ce que ce site ne dit pas</h3><ul class="m small"><li>Ce n’est pas une consigne de vote : un petit nombre de votes donne un signal fragile.</li><li>Un groupe peut voter contre un texte pour d’autres raisons que son principe.</li><li>Les promesses sont tirées d’articles de presse et d’un comparatif tiers, avec paraphrase. Les programmes de la droite républicaine, de l’UDR et de LIOT ne sont pas encore traités.</li><li>Les chiffres de présence mesurent la participation aux scrutins publics, pas tout le travail d’un député (commissions, circonscription).</li></ul></div>
  <div class="card reveal"><h3>Sources des promesses</h3><ul class="m small">${Object.keys(SRC).map(k => `<li><a href="${SRC[k][1]}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a></li>`).join('')}</ul></div>
  <button class="btn primary" data-act="back">← Retour</button>`;
}

/* ---------- rendu et événements ---------- */
function countUps() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-count]').forEach(el => { const to = +el.dataset.count, suf = el.dataset.suf || '', t0 = performance.now(); const f = t => { const p = Math.min(1, (t - t0) / 900); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))) + suf; if (p < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); });
}
function render(keep) {
  $app.classList.toggle('still', !!state.still);
  $app.innerHTML = state.screen === 'intro' ? topbar() + viewIntro() : state.screen === 'prio' ? topbar() + viewPrio() : state.screen === 'quiz' ? topbar() + viewQuiz() : state.screen === 'stats' ? viewStats() : state.screen === 'how' ? viewHow() : state.screen === 'story' ? viewStory() : viewResult();
  if (state.screen === 'quiz') bindSwipe();
  if (state.screen === 'result') { state.still = true; setTimeout(() => document.querySelectorAll('.sc').forEach(s => s.classList.add('on')), state.still && keep ? 0 : 450); }
  document.body.style.overflow = state.screen === 'story' ? 'hidden' : '';
  if (state.screen === 'story') { setTimeout(() => document.querySelectorAll('.sc').forEach(s => s.classList.add('on')), 350); if (document.getElementById('cardimg')) ensureCard(); }
  countUps();
  if (!keep) window.scrollTo({ top: 0 });
}
function answer(v) { const q = byN[state.order[state.idx]]; state.answers[q.n] = v; if (state.pron) { state.predict = q.n; state.reveal = null; } else { state.predict = null; state.reveal = q.n; } render(); }
function bindSwipe() {

  el.addEventListener('pointerdown', e => { if (e.target.closest('summary,a,button')) return; on = true; sx = e.clientX; dx = 0; try { el.setPointerCapture(e.pointerId); } catch (_) {} el.style.animation = 'none'; el.style.transition = 'none'; });
  el.addEventListener('pointermove', e => { if (!on) return; dx = e.clientX - sx; el.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`; el.dataset.dir = dx > 40 ? 'pour' : dx < -40 ? 'contre' : ''; el.style.setProperty('--sp', Math.max(0, Math.min(1, dx / 100))); el.style.setProperty('--sc', Math.max(0, Math.min(1, -dx / 100))); });
  const end = () => { if (!on) return; on = false; el.style.transition = ''; if (Math.abs(dx) > 100) { const v = dx > 0 ? 'pour' : 'contre'; el.style.transform = `translateX(${dx > 0 ? 700 : -700}px) rotate(${dx > 0 ? 20 : -20}deg)`; setTimeout(() => answer(v), 180); } else { el.style.transform = ''; el.dataset.dir = ''; el.style.setProperty('--sp', 0); el.style.setProperty('--sc', 0); } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);

function applyHl() { document.querySelectorAll('#hemires .seat').forEach(s => s.classList.toggle('dim', !!state.hl && s.dataset.g !== state.hl)); }

});
